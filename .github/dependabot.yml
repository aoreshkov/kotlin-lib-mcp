version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # Kotlin and the Analysis API artifacts are version-locked and must move together;
      # grouping keeps them (and other minor/patch bumps) in one reviewable PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Kotlin and the version-locked Analysis API `-for-ide` jars must move together with
      # their coupled pins — that's what the /analysis-api-bump skill is for, so a Dependabot
      # PR here was never mergeable as-is. They are also why this job used to time out: 17
      # deps resolve to the (huge) JetBrains/kotlin repo and each costs ~101s of changelog
      # lookup while building the PR body — ~29 min against a 55 min cap. Two patterns are
      # needed because Gradle plugin ids parse as bare ids with no `:` separator. Both must
      # stay version-less: an ignore that only narrows `update-types` still pays that cost.
      - dependency-name: "org.jetbrains.kotlin:*"     # libraries + the -for-ide jars
      - dependency-name: "org.jetbrains.kotlin.*"     # Gradle plugin ids
      # Caffeine is pinned to the version the Analysis API `-for-ide` jars expect
      # (see gradle/libs.versions.toml) — don't propose major bumps.
      - dependency-name: "com.github.ben-manes.caffeine:caffeine"
        update-types: ["version-update:semver-major"]
      # Not a dependency: Dependabot's Gradle parser reads any `a:b:c` string literal as
      # `group:name:version`, so the JVM flag "-Xlog:all=warning:stderr" in
      # server/build.gradle.kts becomes "-Xlog:all=warning" at version "stderr". Looking it up
      # in the IntelliJ repository fails as `private_source_authentication_failure`, which
      # fails the whole update job.
      - dependency-name: "-Xlog:*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action init/analyze pins must move in the same PR (mixed versions fail
      # with "Loaded a configuration file for version X, but running version Y");
      # grouping all action bumps also keeps the weekly churn to one PR.
      github-actions:
        patterns: ["*"]

  # The MCP conformance suite CI runs (.github/conformance). A bump can add scenarios, so its PR
  # is where new failures get triaged into baseline.yml or fixed.
  - package-ecosystem: npm
    directory: /.github/conformance
    schedule:
      interval: weekly

  # Keeps the digest-pinned eclipse-temurin base image fresh (JRE CVE patches).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

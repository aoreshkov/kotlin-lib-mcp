# Behavioural evals for the Claude Code plugin (plugin/evals/).
#
# These are not unit tests: every run makes real model calls and costs real money, so this
# workflow is deliberately NOT part of CI.
#
# It needs an ANTHROPIC_API_KEY secret, and this repository does not have one. Until it does there
# is **no pull_request trigger**, on purpose: a check that appears on every plugin PR and passes
# without running anything is worse than no check at all — six months from now a green
# "plugin evals" reads as evidence to whoever didn't watch it skip. So while the gate is off, the
# suite runs from a developer's machine (see plugin/evals/README.md) and CI stays quiet.
#
# The job still knows how to skip: `schedule` and `workflow_dispatch` runs without the secret
# report "skipped" and succeed, rather than failing a fork that has no credentials.
#
# To turn the gate on once the secret exists, restore the PR trigger:
#
#   on:
#     pull_request:
#       paths:
#         - 'plugin/**'
#         - 'server/src/main/kotlin/tools/**'
#         - '.github/workflows/plugin-evals.yml'
#
# and add `&& github.event_name != 'pull_request'` to the "Run the WebFetch baseline case" step
# below, so a PR does not pay for `lookup-vs-web` — it reads GitHub, so it fails on a network
# hiccup and tells you nothing about the diff. The offline step already runs the right cases, and
# must keep running with no --allow-tools grant of its own; the comment on it says why.
name: Plugin evals

on:
  schedule:
    # Mondays 06:00 UTC — the thing under test is a model, and model behaviour drifts under a
    # suite that hasn't changed at all. This is the trigger that earns its keep.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a score moving means behaviour moved, not that a default changed under us.
  CLAUDE_CODE_VERSION: '2.1.269'
  AGENT_MODEL: claude-sonnet-5
  JUDGE_MODEL: claude-haiku-4-5

jobs:
  evals:
    name: plugin evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `secrets` is not available in a job-level `if`, so gate on an output instead.
      - name: Check for credentials
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "### Plugin evals skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`ANTHROPIC_API_KEY\` secret is set, so the suite did not run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Install Claude Code
        if: steps.gate.outputs.ok == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # TWO invocations, and they must stay two. `--allow-tools` applies to every case in the run,
      # not just the cases that list the tool in `allowed_tools` — so running the whole suite with
      # `--allow-tools WebFetch` hands WebFetch to `recall-vs-lookup`'s baseline arm as well, which
      # is precisely the arm that is supposed to be working from memory. Measured 2026-09-13:
      # granted suite-wide the flagship reads W/OUT 1.00, Δ 0.00 with `commits-to-an-answer`
      # passing 3/3; run without the grant the same case reads W/OUT 0.53, Δ +0.47 with that
      # grader failing 3/3. One flag silently turns the flagship into a second copy of
      # `lookup-vs-web` and reports the plugin as worthless.
      - name: Run the offline cases
        if: steps.gate.outputs.ok == 'true'
        working-directory: plugin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --tag core --tag anti-trigger \
            --trust-plugin \
            --threshold 0.8 \
            --model "$AGENT_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --no-publish \
            --max-cost-usd 10 \
            --json "$GITHUB_WORKSPACE/eval-results-offline.json"

      # The network case, alone, with the grant it needs. Runs even if the offline cases failed:
      # both numbers are wanted, and a red suite is not a reason to skip half the evidence.
      - name: Run the WebFetch baseline case
        if: always() && steps.gate.outputs.ok == 'true'
        working-directory: plugin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --tag network \
            --allow-tools WebFetch \
            --trust-plugin \
            --threshold 0.8 \
            --model "$AGENT_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --no-publish \
            --max-cost-usd 6 \
            --json "$GITHUB_WORKSPACE/eval-results-web.json"

      # Cosmetic: the exit codes above are the gate, so a jq slip must never fail the job.
      - name: Summarise
        if: always() && steps.gate.outputs.ok == 'true'
        continue-on-error: true
        run: |
          for f in eval-results-offline.json eval-results-web.json; do
            [ -f "$f" ] || continue
            jq -r --arg f "$f" '
              def r: if . == null then "—" else (((. * 100) | round) / 100 | tostring) end;
              "### Plugin evals — \($f | ltrimstr("eval-results-") | rtrimstr(".json"))",
              "",
              "Suite \(.aggregates.overallScore | r) · mean Δ \(.aggregates.meanDelta | r) · \(.aggregates.casesPassed)/\(.aggregates.casesTotal) cases at threshold · $\(.costUsd | r)",
              "",
              "| Case | WITH | W/OUT | Δ |",
              "| :--- | ---: | ---: | ---: |",
              (.cases[] | "| \(.name) | \(.aggregates.score | r) | \(.aggregates.scoreWithout | r) | \(.aggregates.delta | r) |"),
              "",
              # Watch this grader on its own: a regression in it can hide inside a Δ that stays positive.
              "**commits-to-an-answer** (with-arm): " + (
                [.cases[].arms.with[]?.graders[]? | select(.name == "commits-to-an-answer")]
                | if length == 0 then "not run"
                  else "\([.[] | select(.passed)] | length)/\(length) runs passed" end
              ),
              ""
            ' "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload results
        if: always() && steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: |
            eval-results-offline.json
            eval-results-web.json
            plugin/evals/results/**/report.html
          retention-days: 30
          if-no-files-found: warn

# Behavioural evals for the Claude Code plugin (plugin/evals/).
#
# These are not unit tests: every run makes real model calls and costs real money, so this
# workflow is deliberately NOT part of CI.
#
# It needs an ANTHROPIC_API_KEY secret, and this repository does not have one. Until it does there
# is **no pull_request trigger**, on purpose: a check that appears on every plugin PR and passes
# without running anything is worse than no check at all — six months from now a green
# "plugin evals" reads as evidence to whoever didn't watch it skip. So while the gate is off, the
# suite runs from a developer's machine (see plugin/evals/README.md) and CI stays quiet.
#
# The job still knows how to skip: `schedule` and `workflow_dispatch` runs without the secret
# report "skipped" and succeed, rather than failing a fork that has no credentials.
#
# To turn the gate on once the secret exists, restore the PR trigger and the offline-only step:
#
#   on:
#     pull_request:
#       paths:
#         - 'plugin/**'
#         - 'server/src/main/kotlin/tools/**'
#         - '.github/workflows/plugin-evals.yml'
#
#   - name: Run offline cases
#     if: steps.gate.outputs.ok == 'true' && github.event_name == 'pull_request'
#     working-directory: plugin
#     env:
#       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#     run: |
#       claude plugin eval . --tag core --tag anti-trigger --trust-plugin --threshold 0.8 \
#         --model "$AGENT_MODEL" --judge-model "$JUDGE_MODEL" --no-publish --max-cost-usd 8 \
#         --json "$GITHUB_WORKSPACE/eval-results.json"
#
# and add `&& github.event_name != 'pull_request'` back to the "Run the suite" step below, so a PR
# doesn't pay for `lookup-vs-web`, which reads GitHub and fails on a network hiccup.
name: Plugin evals

on:
  schedule:
    # Mondays 06:00 UTC — the thing under test is a model, and model behaviour drifts under a
    # suite that hasn't changed at all. This is the trigger that earns its keep.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a score moving means behaviour moved, not that a default changed under us.
  CLAUDE_CODE_VERSION: '2.1.269'
  AGENT_MODEL: claude-sonnet-5
  JUDGE_MODEL: claude-haiku-4-5

jobs:
  evals:
    name: plugin evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `secrets` is not available in a job-level `if`, so gate on an output instead.
      - name: Check for credentials
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "### Plugin evals skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`ANTHROPIC_API_KEY\` secret is set, so the suite did not run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Install Claude Code
        if: steps.gate.outputs.ok == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Everything, including `lookup-vs-web`, which grants WebFetch and reads GitHub.
      - name: Run the suite
        if: steps.gate.outputs.ok == 'true'
        working-directory: plugin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --trust-plugin \
            --threshold 0.8 \
            --model "$AGENT_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --allow-tools WebFetch \
            --no-publish \
            --max-cost-usd 15 \
            --json "$GITHUB_WORKSPACE/eval-results.json"

      # Cosmetic: the exit code above is the gate, so a jq slip must never fail the job.
      - name: Summarise
        if: always() && steps.gate.outputs.ok == 'true' && hashFiles('eval-results.json') != ''
        continue-on-error: true
        run: |
          jq -r '
            def r: if . == null then "—" else (((. * 100) | round) / 100 | tostring) end;
            "### Plugin evals",
            "",
            "Suite \(.aggregates.overallScore | r) · mean Δ \(.aggregates.meanDelta | r) · \(.aggregates.casesPassed)/\(.aggregates.casesTotal) cases at threshold · $\(.costUsd | r)",
            "",
            "| Case | WITH | W/OUT | Δ |",
            "| :--- | ---: | ---: | ---: |",
            (.cases[] | "| \(.name) | \(.aggregates.score | r) | \(.aggregates.scoreWithout | r) | \(.aggregates.delta | r) |"),
            "",
            # Watch this grader on its own: a regression in it can hide inside a Δ that stays positive.
            "**commits-to-an-answer** (with-arm): " + (
              [.cases[].arms.with[]?.graders[]? | select(.name == "commits-to-an-answer")]
              | if length == 0 then "not run"
                else "\([.[] | select(.passed)] | length)/\(length) runs passed" end
            )
          ' eval-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && steps.gate.outputs.ok == 'true' && hashFiles('eval-results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: |
            eval-results.json
            plugin/evals/results/**/report.html
          retention-days: 30
          if-no-files-found: warn

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Every publishing job runs only once `verify` has passed. A tag does not have to point at a commit
# CI has seen, and the publishing jobs are not undone by a later failure: the zip reaches plugin
# users through the launcher's `latest`, and GHCR tags are pulled as soon as they exist.
jobs:
  verify:
    name: Verify (tag guard, build, end-to-end smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches project version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version=${VERSION}$" gradle.properties || {
            echo "Tag ${GITHUB_REF_NAME} does not match version in gradle.properties"; exit 1; }
          jq -e --arg v "$VERSION" '.version == $v' server.json > /dev/null || {
            echo "Tag ${GITHUB_REF_NAME} does not match version in server.json"; exit 1; }
          # The advertised MCP `Implementation` version is build-derived from gradle.properties
          # (server/build.gradle.kts -> ServerVersion) and asserted by ServerVersionTest, so it
          # cannot drift and needs no separate guard here.

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build and test
        run: ./gradlew build

      - name: Build server distribution
        run: ./gradlew :server:installDist

      # The release zip as plugin users run it: through the launcher, with the command line read from
      # plugin/.mcp.json. A wrong jar order or an Analysis API pin out of step fails only at runtime,
      # so this fetches and analyzes a real library rather than trusting the unit tests' fixtures.
      - name: Launcher runs the release distribution, which analyzes a real library and exits
        run: |
          mapfile -t args < <(jq -r '.mcpServers["kotlin-lib"].args[]' plugin/.mcp.json \
            | sed 's|${CLAUDE_PLUGIN_ROOT}|plugin|')
          KOTLIN_LIB_MCP_SERVER_HOME=server/build/install/server \
            python3 .github/scripts/analyze-smoke.py java "${args[@]}" --cache-dir "$RUNNER_TEMP/cache"

  github-release:
    name: GitHub Release (server zip)
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build server distribution
        run: ./gradlew :server:installDist

      # Scanned before packaging, while the directory still has its stable name. The
      # distribution's lib/ is ~100 jars, including kotlin-compiler's shaded copies of
      # libraries it does not name. Provenance alone says who built the zip, not what is
      # inside it — which is what a consumer needs to answer "am I exposed to CVE-X?".
      - name: Generate SBOM (release zip)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: server/build/install/server
          format: spdx-json
          output-file: kotlin-lib-mcp-server.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package distribution
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd server/build/install
          mv server "kotlin-lib-mcp-server-${VERSION}"
          zip -qr "kotlin-lib-mcp-server-${VERSION}.zip" "kotlin-lib-mcp-server-${VERSION}"

      - name: Attest build provenance (release zip)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: server/build/install/kotlin-lib-mcp-server-*.zip

      - name: Attest SBOM (release zip)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: server/build/install/kotlin-lib-mcp-server-*.zip
          sbom-path: kotlin-lib-mcp-server.spdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: server/build/install/kotlin-lib-mcp-server-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build server distribution
        run: ./gradlew :server:installDist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Test before push (Docker's documented pattern): build the runner's own platform into the
      # local image store, run CI's image smoke test on it, and only then build and push every
      # platform. The push reuses this build's cache, so the amd64 image it publishes is the one
      # tested here; arm64 is exercised only by the Dockerfile's AOT training session, under QEMU.
      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kotlin-lib-mcp:smoke

      - name: Image passes the smoke test
        run: .github/scripts/image-smoke.sh kotlin-lib-mcp:smoke

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kotlin-lib-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The MCP registry validates OCI packages via this annotation.
          annotations: |
            io.modelcontextprotocol.server.name=io.github.aoreshkov/kotlin-lib-mcp
          # Buildx attaches an SPDX SBOM to the pushed manifest, per platform, covering both
          # the JRE base layer and the distribution's jars. `provenance` stays off: the
          # signed attestation comes from the attest-build-provenance step below, and
          # buildx's own unsigned one would only be a second, weaker claim on the manifest.
          sbom: true
          provenance: false

      - name: Attest build provenance (Docker image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kotlin-lib-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [github-release, docker]
    permissions:
      id-token: write # GitHub OIDC login to the registry — no stored secret
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        env:
          # Pinned + checksum-verified: this binary runs in the job holding the
          # id-token:write registry-publish credential. Bump deliberately — take the
          # new SHA-256 from the release's registry_<version>_checksums.txt asset.
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Sync server.json version with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             '.version = $v | .packages[0].identifier = "ghcr.io/aoreshkov/kotlin-lib-mcp:" + $v' \
             server.json > server.json.tmp && mv server.json.tmp server.json
          cat server.json

      - name: Login and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Coroutine cancellation is an exception and `runCatching` catches every Throwable, so a
      # withdrawn request carried on as an ordinary failure. Server code uses the re-throwing
      # `runCatchingCancellable` (server/src/main/kotlin/RunCatching.kt). The rule had been broken
      # twice while it was only written down; one leg is enough, the sources are the same.
      - name: No runCatching in server code
        if: runner.os == 'Linux'
        run: |
          if grep -rnE '\brunCatching[[:space:]]*[{(]' --include='*.kt' server/src/main; then
            echo "::error::runCatching swallows CancellationException; use runCatchingCancellable instead"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # Includes Gradle wrapper validation and build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` now also runs `koverVerify` in both covered modules and fails below the floor.
      - name: Build, test, verify coverage and check API compatibility
        run: ./gradlew build

      # Uploaded from the Linux leg only — the numbers are identical on both, and one copy is
      # enough to see where a coverage-floor failure came from.
      - name: Upload coverage reports
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            core/build/reports/kover/
            server/build/reports/kover/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  claude-code-plugin:
    name: Claude Code plugin manifests
    runs-on: ubuntu-latest
    env:
      # 2.1.281 or later: earlier `validate` skips the checks on the plugin's MCP servers.
      # Pinned so a new Claude Code release cannot change what `--strict` accepts without a
      # reviewed commit. Bump it deliberately.
      CLAUDE_CODE_VERSION: 2.1.294
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version check below compares against the last release tag.
          fetch-depth: 0

      # The plugin is consumed straight from this repository by
      # `/plugin marketplace add aoreshkov/kotlin-lib-mcp`, so a broken manifest ships the
      # moment it lands on main — there is no build step between here and the user. This job
      # is that build step.
      - name: Validate the marketplace and plugin manifests
        run: |
          MARKET=.claude-plugin/marketplace.json
          PLUGIN=plugin/.claude-plugin/plugin.json
          jq -e '.name and .owner.name and (.plugins | length > 0)' "$MARKET" > /dev/null
          jq -e '.name and .version and .description' "$PLUGIN" > /dev/null

          # Every marketplace entry must point at a directory that actually holds a plugin,
          # and must agree with that plugin's own declared name.
          for src in $(jq -r '.plugins[].source' "$MARKET"); do
            test -f "${src}/.claude-plugin/plugin.json" || {
              echo "Marketplace source ${src} has no .claude-plugin/plugin.json"; exit 1; }
          done
          market_name=$(jq -r '.plugins[0].name' "$MARKET")
          plugin_name=$(jq -r '.name' "$PLUGIN")
          test "$market_name" = "$plugin_name" || {
            echo "marketplace plugin name '${market_name}' != plugin.json name '${plugin_name}'"
            exit 1; }

          # Every skill directory the plugin ships must actually contain a SKILL.md.
          for d in plugin/skills/*/; do
            test -f "${d}SKILL.md" || { echo "Skill ${d} has no SKILL.md"; exit 1; }
          done

      # The MCP entry must keep resolving the launcher through ${CLAUDE_PLUGIN_ROOT} — a bare
      # relative path would resolve against the session's working directory — and must keep the
      # -Xlog options that route the JVM's own logging off stdout, the protocol channel. The
      # distribution's start script passes the same ones (applicationDefaultJvmArgs).
      - name: Plugin MCP entry runs the launcher
        run: |
          entry='.mcpServers["kotlin-lib"]'
          jq -e "${entry}.command == \"\${user_config.java}\"" plugin/.mcp.json > /dev/null
          jq -e "${entry}.args | index(\"-Xlog:all=warning:stderr\")" plugin/.mcp.json > /dev/null
          launcher=$(jq -r "${entry}.args[-1]" plugin/.mcp.json)
          case "$launcher" in
            '${CLAUDE_PLUGIN_ROOT}/'*) ;;
            *) echo "the launcher path must start with \${CLAUDE_PLUGIN_ROOT}/: ${launcher}"; exit 1 ;;
          esac
          test -f "plugin/${launcher#\$\{CLAUDE_PLUGIN_ROOT\}/}" || {
            echo "plugin/.mcp.json runs ${launcher}, which is not in plugin/"; exit 1; }
          echo "OK: plugin/.mcp.json runs ${launcher}"

      # Claude Code updates an installed plugin only when plugin.json's `version` changes, so
      # a change under plugin/ without a bump never reaches anyone who already has it. That
      # covers users of this repository's marketplace, and of any marketplace that pins a
      # release of it. Bump once per release cycle, in the first change after a tag. evals/
      # and README.md are left out: Claude Code never loads either.
      - name: Plugin version moves with the plugin
        run: |
          dir=plugin
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null) || {
            echo "No release tag yet: nothing to compare against"; exit 0; }
          paths=("$dir" ":(exclude)${dir}/evals" ":(exclude)${dir}/README.md")
          if git diff --quiet "$tag" HEAD -- "${paths[@]}"; then
            echo "OK: ${dir}/ unchanged since ${tag}"; exit 0
          fi
          was=$(git show "${tag}:${dir}/.claude-plugin/plugin.json" | jq -r .version)
          now=$(jq -r .version "${dir}/.claude-plugin/plugin.json")
          test "$now" != "$was" || {
            echo "::error file=${dir}/.claude-plugin/plugin.json::${dir}/ changed since ${tag}, but its version is still ${now}. Bump it, or users who have ${now} never get the change."
            git diff --stat "$tag" HEAD -- "${paths[@]}"
            exit 1; }
          echo "OK: ${dir}/ changed since ${tag}, and its version moved ${was} -> ${now}"

      # The jq checks above cover this repository's own invariants; `validate` covers Claude
      # Code's, including each MCP server entry and every ${user_config.*} reference.
      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: claude plugin validate --strict
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugin --strict

  # The plugin runs the server through plugin/launcher on the user's own JDK, in the launcher's
  # JVM — a different road from the Docker image and the start script, with its own ways to break.
  plugin-launcher:
    name: Claude Code plugin launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The launcher runs in single-file source mode on the user's machine, where a compile error
      # surfaces only as an MCP server that fails to connect. `--release 21` keeps it compiling on a
      # JDK older than the server needs, so there it can still say so instead of failing silently.
      - name: Compile the launcher for Java 21
        run: javac --release 21 -Xlint:all -Werror -d "${RUNNER_TEMP}/launcher" plugin/launcher/*.java

      - name: Build server distribution
        run: ./gradlew :server:installDist

      # The command line is read from plugin/.mcp.json, so this runs what the plugin runs. Loading
      # the distribution into the launcher's class loader is where a wrong jar order shows up — the
      # launcher takes it from bin/server, and without the kotlin-compiler hoist the server dies
      # with NoSuchMethodError before it answers anything.
      - name: Launcher runs this commit's server, which analyzes a real library and exits
        run: |
          mapfile -t args < <(jq -r '.mcpServers["kotlin-lib"].args[]' plugin/.mcp.json \
            | sed 's|${CLAUDE_PLUGIN_ROOT}|plugin|')
          KOTLIN_LIB_MCP_SERVER_HOME=server/build/install/server \
            python3 .github/scripts/analyze-smoke.py java "${args[@]}" --cache-dir "$RUNNER_TEMP/cache"

      # The download path, against the newest published release: resolve `latest`, fetch the zip,
      # verify it against GitHub's asset digest, unpack, load. `--help` keeps it to a class load.
      - name: Launcher installs the latest release and starts it
        run: |
          mapfile -t args < <(jq -r '.mcpServers["kotlin-lib"].args[]' plugin/.mcp.json \
            | sed 's|${CLAUDE_PLUGIN_ROOT}|plugin|')
          data="$RUNNER_TEMP/plugin-data"
          out=$(CLAUDE_PLUGIN_DATA="$data" java "${args[@]}" --help)
          grep -q 'kotlin-lib-mcp' <<< "$out" || { echo "no --help output: ${out}"; exit 1; }
          version=$(cat "$data/latest-release.txt")
          test -d "$data/dist/${version}/lib" || { echo "no install under ${data}/dist/${version}"; exit 1; }
          echo "OK: installed and started ${version}"

  docker-smoke:
    name: Docker image smoke (JDK 25 runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Dockerfile is runtime-only: it COPYs the distribution rather than building it,
      # so `docker build .` alone does not work and this ordering is the supported one.
      - name: Build server distribution
        run: ./gradlew :server:installDist

      - name: Build image
        run: docker build -t kotlin-lib-mcp:smoke .

      # The shipped distribution in the image's own JRE, with its AOT cache: cache-volume ownership,
      # the MCP handshake, and a real library analyzed end to end. The release runs the same script
      # on the image it is about to push, so this is also a rehearsal of that gate.
      - name: Image passes the smoke test
        run: .github/scripts/image-smoke.sh kotlin-lib-mcp:smoke

  # The official MCP conformance suite, run against the shipped distribution over Streamable HTTP.
  # Unit tests pin individual behaviours; this checks the wire against the spec as an independent
  # client sees it (initialize, ping, completion, tools/resources/prompts listing, SSE streams,
  # DNS-rebinding protection, every message schema-validated). Scenarios that need the suite's own
  # fixture server are listed, with the reason, in .github/conformance/baseline.yml.
  conformance:
    name: MCP conformance (Streamable HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build server distribution
        run: ./gradlew :server:installDist

      # Pinned by package-lock.json and installed without lifecycle scripts, rather than a floating
      # `npx`. ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Install the conformance suite
        run: npm ci --prefix .github/conformance --ignore-scripts --no-audit --no-fund

      - name: Start the server over Streamable HTTP
        run: |
          server/build/install/server/bin/server --transport http --port 3000 \
            --cache-dir "$RUNNER_TEMP/cache" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3000/mcp && exit 0
            sleep 1
          done
          echo "the server did not start listening"; cat "$RUNNER_TEMP/server.log"; exit 1

      # Fails on any failing scenario that is not in the baseline, and on a baseline entry that
      # now passes, so the baseline cannot go stale.
      - name: Run the conformance suite
        run: >
          .github/conformance/node_modules/.bin/conformance server
          --url http://127.0.0.1:3000/mcp
          --expected-failures .github/conformance/baseline.yml
          --output-dir "$RUNNER_TEMP/conformance"

      - name: Upload conformance results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            ${{ runner.temp }}/conformance/
            ${{ runner.temp }}/server.log
          retention-days: 7

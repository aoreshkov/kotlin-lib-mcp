name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # Includes Gradle wrapper validation and build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` now also runs `koverVerify` in both covered modules and fails below the floor.
      - name: Build, test, verify coverage and check API compatibility
        run: ./gradlew build

      # Uploaded from the Linux leg only — the numbers are identical on both, and one copy is
      # enough to see where a coverage-floor failure came from.
      - name: Upload coverage reports
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            core/build/reports/kover/
            server/build/reports/kover/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  claude-code-plugin:
    name: Claude Code plugin manifests
    runs-on: ubuntu-latest
    env:
      # 2.1.281 or later: earlier `validate` skips the checks on the plugin's MCP servers.
      # Pinned so a new Claude Code release cannot change what `--strict` accepts without a
      # reviewed commit. Bump it deliberately.
      CLAUDE_CODE_VERSION: 2.1.294
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version check below compares against the last release tag.
          fetch-depth: 0

      # The plugin is consumed straight from this repository by
      # `/plugin marketplace add aoreshkov/kotlin-lib-mcp`, so a broken manifest ships the
      # moment it lands on main — there is no build step between here and the user. This job
      # is that build step.
      - name: Validate the marketplace and plugin manifests
        run: |
          MARKET=.claude-plugin/marketplace.json
          PLUGIN=plugin/.claude-plugin/plugin.json
          jq -e '.name and .owner.name and (.plugins | length > 0)' "$MARKET" > /dev/null
          jq -e '.name and .version and .description' "$PLUGIN" > /dev/null

          # Every marketplace entry must point at a directory that actually holds a plugin,
          # and must agree with that plugin's own declared name.
          for src in $(jq -r '.plugins[].source' "$MARKET"); do
            test -f "${src}/.claude-plugin/plugin.json" || {
              echo "Marketplace source ${src} has no .claude-plugin/plugin.json"; exit 1; }
          done
          market_name=$(jq -r '.plugins[0].name' "$MARKET")
          plugin_name=$(jq -r '.name' "$PLUGIN")
          test "$market_name" = "$plugin_name" || {
            echo "marketplace plugin name '${market_name}' != plugin.json name '${plugin_name}'"
            exit 1; }

          # Every skill directory the plugin ships must actually contain a SKILL.md.
          for d in plugin/skills/*/; do
            test -f "${d}SKILL.md" || { echo "Skill ${d} has no SKILL.md"; exit 1; }
          done

      # The image pin drifts silently: nothing at runtime notices that the plugin points at
      # a tag which no longer matches the project version, and users just get an old server.
      # /release bumps both on a minor release; this asserts it actually happened.
      - name: Plugin MCP image pin matches the project's <major>.<minor>
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          expected="${version%.*}"
          image=$(jq -r '.mcpServers["kotlin-lib"].args[-1]' plugin/.mcp.json)
          actual="${image##*:}"
          test "$actual" = "$expected" || {
            echo "plugin/.mcp.json pins ${image} but gradle.properties is ${version}"
            echo "expected the image tag to be ${expected}"
            exit 1; }
          echo "OK: ${image} matches version ${version}"

      # Claude Code updates an installed plugin only when plugin.json's `version` changes, so
      # a change under plugin/ without a bump never reaches anyone who already has it. That
      # covers users of this repository's marketplace, and of any marketplace that pins a
      # release of it. Bump once per release cycle, in the first change after a tag. evals/
      # and README.md are left out: Claude Code never loads either.
      - name: Plugin version moves with the plugin
        run: |
          dir=plugin
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null) || {
            echo "No release tag yet: nothing to compare against"; exit 0; }
          paths=("$dir" ":(exclude)${dir}/evals" ":(exclude)${dir}/README.md")
          if git diff --quiet "$tag" HEAD -- "${paths[@]}"; then
            echo "OK: ${dir}/ unchanged since ${tag}"; exit 0
          fi
          was=$(git show "${tag}:${dir}/.claude-plugin/plugin.json" | jq -r .version)
          now=$(jq -r .version "${dir}/.claude-plugin/plugin.json")
          test "$now" != "$was" || {
            echo "::error file=${dir}/.claude-plugin/plugin.json::${dir}/ changed since ${tag}, but its version is still ${now}. Bump it, or users who have ${now} never get the change."
            git diff --stat "$tag" HEAD -- "${paths[@]}"
            exit 1; }
          echo "OK: ${dir}/ changed since ${tag}, and its version moved ${was} -> ${now}"

      # The jq checks above cover this repository's own invariants; `validate` covers Claude
      # Code's, including each MCP server entry and every ${user_config.*} reference.
      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: claude plugin validate --strict
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugin --strict

  docker-smoke:
    name: Docker image smoke (JDK 25 runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Dockerfile is runtime-only: it COPYs the distribution rather than building it,
      # so `docker build .` alone does not work and this ordering is the supported one.
      - name: Build server distribution
        run: ./gradlew :server:installDist

      - name: Build image
        run: docker build -t kotlin-lib-mcp:smoke .

      # Guards the VOLUME ownership: with an anonymous volume at the declared path, the
      # mount point must be owned by the runtime user, or the non-root process cannot create
      # the cache. Docker seeds a fresh volume from the image's directory — so if the
      # `install -d -o mcp` before VOLUME regresses, the volume comes back root-owned and
      # every fetch_library fails with AccessDenied on the user's machine, not here.
      - name: Non-root user can write the cache volume
        run: |
          docker run --rm --entrypoint /bin/sh kotlin-lib-mcp:smoke -eu -c '
            test "$(id -un)" = mcp || { echo "not running as mcp: $(id -un)"; exit 1; }
            owner=$(stat -c "%U" /home/mcp/.cache)
            test "$owner" = mcp || { echo "cache mount point owned by ${owner}, expected mcp"; exit 1; }
            f=/home/mcp/.cache/smoke.txt
            printf ok > "$f"
            test -s "$f" || { echo "could not write ${f}"; exit 1; }
            echo "OK: $(id -un) wrote ${f} on the anonymous volume"
          '

      # The only place the shipped artifact is exercised as it actually ships: the distribution
      # in the image's own Temurin 25 JRE, with its AOT cache, rather than the toolchain JDK the
      # unit tests run on. This also covers tool registration, which is where a classpath conflict
      # with kotlin-compiler's shaded jars surfaces — as a NoSuchMethodError at startup,
      # invisible to compilation and to the unit tests.
      - name: Server completes an MCP handshake and lists its tools
        run: |
          out=$( { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 15; } | docker run --rm -i kotlin-lib-mcp:smoke )
          echo "$out"
          grep -q '"serverInfo"' <<< "$out" || { echo "initialize returned no serverInfo"; exit 1; }
          grep -q '"fetch_library"' <<< "$out" || { echo "tools/list did not list fetch_library"; exit 1; }
          echo "OK: MCP handshake and tools/list answered on the image's JDK"

      # The Analysis API fails at runtime, never at compile time — a coupled pin out of step shows up
      # as NoSuchMethodError or as silently lost type resolution — and the unit tests only analyze
      # fixtures. So: fetch and analyze a real library on the shipped JDK, require a signature that
      # was resolved rather than rendered from text, and require the server to exit by itself once
      # the client closes stdin (the Analysis API's non-daemon threads used to keep it alive).
      # `-XX:AOTMode=on` makes the JVM refuse to start unless the image's AOT cache is usable, where
      # the default would quietly start without it and lose ~0.8 s on every launch.
      - name: Server analyzes a real library and exits when the client disconnects
        run: >
          python3 .github/scripts/analyze-smoke.py
          docker run --rm -i -e SERVER_OPTS="-XX:AOTCache=/app/server.aot -XX:AOTMode=on" kotlin-lib-mcp:smoke

  # The official MCP conformance suite, run against the shipped distribution over Streamable HTTP.
  # Unit tests pin individual behaviours; this checks the wire against the spec as an independent
  # client sees it (initialize, ping, completion, tools/resources/prompts listing, SSE streams,
  # DNS-rebinding protection, every message schema-validated). Scenarios that need the suite's own
  # fixture server are listed, with the reason, in .github/conformance/baseline.yml.
  conformance:
    name: MCP conformance (Streamable HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build server distribution
        run: ./gradlew :server:installDist

      # Pinned by package-lock.json and installed without lifecycle scripts, rather than a floating
      # `npx`. ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Install the conformance suite
        run: npm ci --prefix .github/conformance --ignore-scripts --no-audit --no-fund

      # `--forward-logs-to-client` turns the opt-in logging capability on, so `logging-set-level`
      # is exercised rather than baselined away.
      - name: Start the server over Streamable HTTP
        run: |
          server/build/install/server/bin/server --transport http --port 3000 --forward-logs-to-client \
            --cache-dir "$RUNNER_TEMP/cache" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3000/mcp && exit 0
            sleep 1
          done
          echo "the server did not start listening"; cat "$RUNNER_TEMP/server.log"; exit 1

      # Fails on any failing scenario that is not in the baseline, and on a baseline entry that
      # now passes, so the baseline cannot go stale.
      - name: Run the conformance suite
        run: >
          .github/conformance/node_modules/.bin/conformance server
          --url http://127.0.0.1:3000/mcp
          --expected-failures .github/conformance/baseline.yml
          --output-dir "$RUNNER_TEMP/conformance"

      - name: Upload conformance results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            ${{ runner.temp }}/conformance/
            ${{ runner.temp }}/server.log
          retention-days: 7

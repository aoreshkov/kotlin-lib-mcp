[versions]
# Build tools
kotlin = "2.4.10"
kover = "0.9.9"

# Third-party
mcpKotlinSdk = "0.15.0"
ktor = "3.5.2"
compose = "1.11.1"             # aligned to Kotlin 2.4.x
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
kermit = "2.1.0"
caffeine = "2.9.3"             # runtime dep of the Analysis API `-for-ide` jars; matches Kotlin's own pin
intellijCoroutines = "1.10.2-intellij-1"  # JetBrains coroutines fork the bundled IJ core expects (KT-81457)
slf4j = "2.0.18"
kotlinLogging = "8.0.4"        # matches the MCP SDK's transitive facade; needed to silence its stdout banner
logback = "1.6.3"
opentelemetry = "1.65.0"       # BOM governs every io.opentelemetry artifact below

[libraries]
# Build (gradle-plugin classpath for build-logic convention plugins)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# The serialization plugin ships as its own artifact (the `org.jetbrains.kotlin.plugin.serialization`
# marker resolves to exactly this), so convention plugins can only apply it version-less if it is
# on the build-logic classpath.
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
composeCompiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# MCP (server-only artifact — the SDK is modular since 0.9.x)
mcp-kotlinSdkServer = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcpKotlinSdk" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Source analysis (Kotlin Analysis API, standalone K2/FIR — version-matched to kotlin).
# These `-for-ide` shaded jars live in the IntelliJ dependencies repo and must be pulled
# non-transitively (their POMs reference logical modules not published separately).
analysisApi-standalone = { module = "org.jetbrains.kotlin:analysis-api-standalone-for-ide", version.ref = "kotlin" }
analysisApi-highLevel = { module = "org.jetbrains.kotlin:analysis-api-for-ide", version.ref = "kotlin" }
analysisApi-k2 = { module = "org.jetbrains.kotlin:analysis-api-k2-for-ide", version.ref = "kotlin" }
analysisApi-lowLevelFir = { module = "org.jetbrains.kotlin:low-level-api-fir-for-ide", version.ref = "kotlin" }
analysisApi-implBase = { module = "org.jetbrains.kotlin:analysis-api-impl-base-for-ide", version.ref = "kotlin" }
analysisApi-platform = { module = "org.jetbrains.kotlin:analysis-api-platform-interface-for-ide", version.ref = "kotlin" }
analysisApi-symbolLightClasses = { module = "org.jetbrains.kotlin:symbol-light-classes-for-ide", version.ref = "kotlin" }
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
# The `-for-ide` jars are resolved non-transitively, so their runtime deps are declared here.
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
intellij-coroutinesCore = { module = "org.jetbrains.intellij.deps.kotlinx:kotlinx-coroutines-core", version.ref = "intellijCoroutines" }

# Logging
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlinLogging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlinLogging" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# OpenTelemetry (opt-in OTLP/HTTP traces; see server/.../telemetry/Telemetry.kt).
# Only the BOM carries a version — it aligns every artifact below.
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-autoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure" }
# Propagates the OTel Context across suspend/dispatcher boundaries (stable).
opentelemetry-extension-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
# Zero-dependency http/protobuf sender (JDK HttpClient); replaces the default OkHttp sender.
opentelemetry-sender-jdk = { module = "io.opentelemetry:opentelemetry-exporter-sender-jdk" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Every other plugin is applied by id from a `build-logic` convention plugin, which resolves it
# from the `*-gradle-plugin` classpath entries above — an alias here would be dead weight. Only
# plugins applied with `alias(libs.plugins.…)` in a module's own build script belong in this section.
[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
